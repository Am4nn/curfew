name: "Deploy: Preview"

# Every push to main becomes the dev site, deployed from here rather than by
# Vercel's GitHub App.
#
# Why this exists. The App is a silent dependency: when its installation is
# suspended or waiting on a permissions approval, push events simply stop
# arriving. Nothing errors. The repo is still linked, the project is not paused,
# every setting reads correctly, and Vercel never learns there was anything to
# build, so a Preview that never happens looks exactly like nothing happening.
# It cost an hour on 2026-09-07 and happened again on 2026-09-15, when the
# release commit got no Preview at all and the dev site sat on an older build
# still pointing at the database production was about to become. A deployment
# that fails is fine. One that silently does not occur is not.
#
# So main is deployed the same way production is: from a workflow, with a run
# in the Actions tab either way. `vercel.json` turns the App's own deploys off
# for this branch, because two systems deploying one branch is two deployments
# per push and a race for the alias.
#
# Gated on CI, the same as production. It WAITS for CI on this commit rather
# than checking whether one happens to have finished: both workflows start from
# the same push, so a glance would always find CI still running and either race
# it or refuse. Deploying the moment a push lands means the dev site can be
# serving a commit CI is about to fail, and then the one place anybody looks at
# a change is showing something known broken.
#
# The cost is that dev trails CI by the length of a run. That is the trade, and
# it was chosen deliberately.

on:
  push:
    branches: [main]
  # A Preview on demand, without a commit.
  workflow_dispatch:

# Only the newest commit matters for a dev site, so a push that lands while
# another is building cancels it rather than queueing behind it.
concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  # Nothing is deployed until CI has finished on this exact commit and passed.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Wait for CI, then require it passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash .github/wait-for-ci.sh

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # The dev site. Named here rather than left to Vercel's branch-domain
      # setting, so the alias is asserted by something that can be read.
      ALIAS: dev.curfew.amanarya.com
    steps:
      - uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No --prebuilt and no --prod. The source goes up and Vercel builds it
      # with the real values of its Preview environment variables, which are
      # sensitive and never come back down to a local build. The CLI prints the
      # deployment URL on stdout and its progress on stderr.
      - name: Deploy a Preview
        id: deploy
        run: |
          url="$(bunx vercel deploy --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed $url"

      # Vercel usually moves a branch domain to the newest deployment on its
      # own. "Usually" is what this workflow exists to stop relying on, and the
      # command is idempotent, so it is asserted rather than assumed.
      #
      # --scope because the token can deploy to the project and still be
      # refused the domain: "You don't have access to the domain
      # dev.curfew.amanarya.com under am4nns-projects". Deploying reads the org
      # from VERCEL_ORG_ID; alias does not, and has to be told.
      #
      # Not fatal on its own. Vercel's branch-domain behaviour has moved the
      # alias correctly every time so far, so a failure here means the
      # assertion could not be made, not that the domain is wrong. The step
      # after it is what actually decides, by asking the domain.
      - name: Point the dev domain at it
        continue-on-error: true
        run: |
          bunx vercel alias set "${{ steps.deploy.outputs.url }}" "$ALIAS" \
            --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
          echo "$ALIAS -> ${{ steps.deploy.outputs.url }}"

      # And the domain is serving THIS build, which is the fact the step above
      # was trying to guarantee. Asked over HTTP, so it holds however the alias
      # got there, including when Vercel moved it and the assertion could not.
      #
      # The fingerprint is the set of `/_next/static/...` paths on the sign-in
      # page. Those filenames are content hashes, so they change whenever the
      # build does. Two builds of identical source fingerprint the same, which
      # is the right answer: the domain is then serving the same app either way.
      - name: The dev domain serves this build
        run: |
          fingerprint() {
            curl -sS --fail --retry 3 --retry-delay 5 "$1/signin" \
              | grep -oE "/_next/static/[^\"']+" | sort | md5sum | cut -d" " -f1
          }
          want="$(fingerprint "${{ steps.deploy.outputs.url }}")"
          got="$(fingerprint "https://$ALIAS")"
          echo "deployment $want"
          echo "$ALIAS $got"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "$ALIAS is not serving this build."
            exit 1
          fi
          echo "$ALIAS is serving this build."

      # The one thing neither the build nor the alias proves: that a stranger
      # can still open the page. LOCAL_MODE makes the middleware stand aside in
      # every CI job that serves the app, so the sign-in gate is the one path
      # the whole suite never takes, and the sign-in page's own photographs sat
      # behind it for a day because of that.
      - name: A signed-out visitor can see the sign-in page
        run: bun run check:signin -- --http=https://${{ env.ALIAS }}
