<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0a09; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }

  </style>
</helmet>
<div style="width:390px;height:844px;background:#000;color:#f2f2f2;font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:20px;">
      <span style="font-size:11px;letter-spacing:0.16em;opacity:0.8;">SLEEP &middot; CONFIRM</span>
      <span style="font-size:11px;color:#8c8c8c;">7:36 AM</span>
    </div>
    <div style="flex:1;margin:0 20px;background:linear-gradient(145deg,#2b2620,#14120f);display:flex;align-items:center;justify-content:center;color:#4a4740;font-size:12px;letter-spacing:0.18em;">CAPTURED FRAME</div>
    <div style="padding:20px;display:flex;gap:10px;">
      <button type="button" style="flex:1;height:46px;border:1px solid #2e2c28;background:transparent;color:#f2f2f2;font-family:inherit;font-size:13.5px;cursor:pointer;">Retake</button>
      <button type="button" style="flex:1;height:46px;border:1px solid #2e2c28;background:transparent;color:#e4574b;font-family:inherit;font-size:13.5px;cursor:pointer;">Discard</button>
      <button type="button" style="flex:1.6;height:46px;border:1px solid #f2f2f2;background:#f2f2f2;color:#0b0a09;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;">Save</button>
    </div>
    <div style="padding:0 20px 30px;font-size:11px;color:#8c8c8c;line-height:1.55;text-align:center;">Nothing is recorded until you save.</div>
  </div>
</x-dc>
</body>
</html>
