<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0a09; }
    a { color: #f2f2f2; } a:hover { color: #8c8c8c; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0a09;color:#f2f2f2;font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 11px;">
    <div style="display:flex;align-items:center;gap:9px;"><span style="color:#8c8c8c;font-size:14px;">&#8249;</span><span style="font-size:14px;font-weight:600;letter-spacing:0.14em;">GYM</span></div>
    <span style="font-size:11px;color:#8c8c8c;">2 of 4</span>
  </div>

  <div style="display:flex;gap:4px;padding:0 20px 0;">
    <div style="flex:1;height:2px;background:#f2f2f2;"></div>
    <div style="flex:1;height:2px;background:#f2f2f2;"></div>
    <div style="flex:1;height:2px;background:#2e2c28;"></div>
    <div style="flex:1;height:2px;background:#2e2c28;"></div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;padding:44px 20px 24px;gap:18px;">

    <span style="font-size:26px;font-weight:600;line-height:1.3;text-wrap:pretty;">How many days a week?</span>
    <span style="font-size:13px;color:#8c8c8c;line-height:1.6;">A minimum, not a cap. Go a fourth time and it still adds to your streak.</span>

    <div style="display:flex;flex-direction:column;gap:9px;margin-top:10px;">
      <div style="display:flex;gap:9px;">
        <div style="flex:1;height:64px;display:flex;align-items:center;justify-content:center;font-size:19px;border:1px solid #2e2c28;color:#8c8c8c;">1</div>
        <div style="flex:1;height:64px;display:flex;align-items:center;justify-content:center;font-size:19px;border:1px solid #2e2c28;color:#8c8c8c;">2</div>
        <div style="flex:1;height:64px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:600;border:1px solid #f2f2f2;background:#f2f2f2;color:#0b0a09;">3</div>
      </div>
      <div style="display:flex;gap:9px;">
        <div style="flex:1;height:64px;display:flex;align-items:center;justify-content:center;font-size:19px;border:1px solid #2e2c28;color:#8c8c8c;">4</div>
        <div style="flex:1;height:64px;display:flex;align-items:center;justify-content:center;font-size:19px;border:1px solid #2e2c28;color:#8c8c8c;">5</div>
        <div style="flex:1;height:64px;display:flex;align-items:center;justify-content:center;font-size:19px;border:1px solid #2e2c28;color:#8c8c8c;">6</div>
      </div>
      <div style="display:flex;gap:9px;">
        <div style="flex:1;height:64px;display:flex;align-items:center;justify-content:center;font-size:19px;border:1px solid #2e2c28;color:#8c8c8c;">7</div>
        <div style="flex:2.06;height:64px;display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid #2e2c28;color:#8c8c8c;">Pick exact days instead</div>
      </div>
    </div>

    <div style="flex:1;"></div>

    <div style="display:flex;gap:10px;">
      <button type="button" style="width:96px;height:50px;border:1px solid #2e2c28;background:transparent;color:#8c8c8c;font-family:inherit;font-size:13.5px;cursor:pointer;flex:none;">Back</button>
      <button type="button" style="flex:1;height:50px;border:1px solid #f2f2f2;background:#f2f2f2;color:#0b0a09;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;">Next</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
