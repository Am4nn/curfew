<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The day is done</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    html, body { margin: 0; background: #000000; overflow: hidden; }
    ::-webkit-scrollbar { width: 0; height: 0; }

    /* Face only. The ball breathes and the mouth widens; nothing travels. */
    @keyframes breath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.022); } }
    @keyframes grin { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07, 1.14); } }
    .b-breath { animation: breath 5.2s ease-in-out infinite; }
    .o-grin   { animation: grin 3.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .b-breath, .o-grin { animation: none; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #ffffff; position: relative; overflow: hidden;">

  <!-- Home underneath, dimmed rather than blacked out, so it reads as something
       that happened to the screen you were on rather than a place you were sent. -->
  <div style="position: absolute; inset: 0; opacity: 0.17; display: flex; flex-direction: column; padding: 20px 20px 0;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; flex-grow: 1; font-size: 13px; font-weight: 600; color: #8e8e93;">THU 17 SEPTEMBER</span>
      <span style="width: 30px; height: 30px; border-radius: 999px; background: #3a3a3c;"></span>
    </div>
    <div style="margin-top: 12px; display: flex; align-items: baseline; gap: 7px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 44px; font-weight: 700; line-height: 1;">7</span>
      <span style="font-size: 22px; font-weight: 600; color: #48484a;">of 7 today</span>
    </div>
    <div style="margin-top: 13px; display: flex; gap: 4px;">
      <sc-for list="{{segments}}" as="s" hint-placeholder-count="7">
        <span style="flex-grow: 1; height: 5px; border-radius: 999px; background: #ff375f;"></span>
      </sc-for>
    </div>
    <div style="margin-top: 20px; border-radius: 14px; background: #1c1c1e; height: 220px;"></div>
    <div style="margin-top: 14px; border-radius: 14px; background: #1c1c1e; height: 180px;"></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55);"></div>

  <!-- The stamp lands on the DATE, not on a line item: a clerk stamps the form.
       The day's activities compress to one row of icons beneath it. -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 0 30px;">

    <div style="transform: rotate(-4deg); border: 3px solid #ff375f; border-radius: 10px; padding: 16px 26px 18px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: rgba(0,0,0,0.35);">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.22em; color: #ff375f;">COMPLETE</span>
      <span style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em; color: #ffffff; line-height: 1.15;">17 September</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; font-weight: 600; letter-spacing: 0.14em; color: rgba(255,55,95,0.75);">SEVEN OF SEVEN</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; max-width: 300px;">
      <sc-for list="{{icons}}" as="i" hint-placeholder-count="7">
        <span style="color: rgba(255,255,255,0.62);" aria-hidden="true">
          <sc-if value="{{i.isWater}}" hint-placeholder-val="{{true}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.6 6 10.4A6 6 0 0 1 6 13.4C6 9.6 12 3 12 3z"/></svg>
          </sc-if>
          <sc-if value="{{i.isFood}}" hint-placeholder-val="{{false}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v8a2.5 2.5 0 0 0 5 0V3M8.5 11v10M18 3c-1.6 1.4-2.4 3.4-2.4 5.6 0 1.6.8 2.6 2.4 2.8V21"/></svg>
          </sc-if>
          <sc-if value="{{i.isGym}}" hint-placeholder-val="{{false}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6M20 9v6M7 7v10M17 7v10M7 12h10"/></svg>
          </sc-if>
          <sc-if value="{{i.isPill}}" hint-placeholder-val="{{false}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="8" rx="4"/><path d="M12 8v8"/></svg>
          </sc-if>
          <sc-if value="{{i.isMoon}}" hint-placeholder-val="{{false}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
          </sc-if>
          <sc-if value="{{i.isBook}}" hint-placeholder-val="{{false}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 19.5A2 2 0 0 0 6 21h13"/></svg>
          </sc-if>
          <sc-if value="{{i.isDesk}}" hint-placeholder-val="{{false}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="13" rx="2.5"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
          </sc-if>
          <sc-if value="{{i.isNight}}" hint-placeholder-val="{{false}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3 2"/><path d="M4 4l16 16"/></svg>
          </sc-if>
        </span>
      </sc-for>
    </div>

    <!--
      REN, and he needed shrinking.

      Sixty-six pixels of green ball stacked above a line, under a rotated
      stamp, read as a third object competing with the stamp rather than as
      somebody reacting to it. He is 42px now and sits BESIDE the sentence, on
      the same line, which is the shape of a person saying something.

      Open eyes and a plain smile rather than the mood sheet's crinkled arcs:
      at this size an arc eye is a squiggle. Legibility beats fidelity on a
      44px face.
    -->
    <div style="display: flex; align-items: center; gap: 12px; max-width: 320px;">
      <div class="b-breath" style="flex: none; position: relative; width: 42px; height: 42px;">
        <div style="position: absolute; inset: 0; border-radius: 999px; background: radial-gradient(circle at 33% 25%, #ffffff 0%, #dbf7e3 18%, #8ae5a6 44%, #2ba553 72%, #0c3a1e 100%);"></div>
        <div style="position: absolute; inset: 0; border-radius: 999px; background: radial-gradient(circle at 50% 50%, transparent 56%, rgba(0,0,0,0.30) 84%, rgba(0,0,0,0.54) 100%);"></div>
        <div style="position: absolute; inset: 0; border-radius: 999px; background: radial-gradient(circle at 31% 23%, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.30) 17%, transparent 34%);"></div>
        <svg viewBox="0 0 116 116" style="position: absolute; inset: 0;" aria-label="Ren, pleased" role="img">
          <path d="M37.6 50a5.4 6.4 0 1 0 10.8 0a5.4 6.4 0 1 0 -10.8 0z M67.6 50a5.4 6.4 0 1 0 10.8 0a5.4 6.4 0 1 0 -10.8 0z" fill="#08301a"/>
          <g class="o-grin" style="transform-origin: 58px 70px;">
            <path d="M45 66q13 13 26 0" fill="none" stroke="#08301a" stroke-width="4.6" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <span style="flex-grow: 1; font-size: 16px; font-weight: 500; color: #ffffff; line-height: 1.4;">Whole day. Nothing&#39;s chasing you tonight.</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const kinds = ['isWater','isFood','isGym','isPill','isMoon','isBook','isNight'];
    const one = (k) => Object.fromEntries(kinds.map((x) => [x, x === k]));
    return {
      segments: Array.from({ length: 7 }, () => ({})),
      icons: kinds.map(one),
    };
  }
}
</script>
</body>
</html>
