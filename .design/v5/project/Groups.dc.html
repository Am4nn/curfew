<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    html, body { margin: 0; background: #000000; overflow: hidden; }
    ::-webkit-scrollbar { width: 0; height: 0; }

    /*
      REVEAL. The sections of a screen rise together on a stagger that
      DECELERATES: the last few land almost at once, so the whole thing reads
      as one gesture arriving rather than a queue being served.

      Expo-out, 620ms, and it runs ONCE. Nothing on a page of content loops. A
      loop is for a character, and Ren is the only character here.

      The travel is 14px. More is a slide, less and the eye misses it.
    */
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    .stage > * { animation: rise 620ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stage > *:nth-child(1)  { animation-delay:   0ms; }
    .stage > *:nth-child(2)  { animation-delay:  73ms; }
    .stage > *:nth-child(3)  { animation-delay: 129ms; }
    .stage > *:nth-child(4)  { animation-delay: 173ms; }
    .stage > *:nth-child(5)  { animation-delay: 208ms; }
    .stage > *:nth-child(6)  { animation-delay: 235ms; }
    .stage > *:nth-child(7)  { animation-delay: 256ms; }
    .stage > *:nth-child(8)  { animation-delay: 272ms; }
    .stage > *:nth-child(9)  { animation-delay: 285ms; }
    .stage > *:nth-child(10) { animation-delay: 295ms; }
    .stage > *:nth-child(n+11) { animation-delay: 302ms; }

    /* Chrome does not arrive. It is simply there, and only fades up. */
    .stage > .tabbar { animation: appear 300ms ease-out both; }

    /* A bar draws itself, after the section carrying it has landed. */
    @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .fill { transform-origin: left center;   animation: fill 900ms 300ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .grow { transform-origin: bottom center; animation: grow 760ms 260ms cubic-bezier(0.16, 1, 0.3, 1) both; }

    /*
      PRESS. 140ms down, and the release rides the same curve rather than
      bouncing: a button that springs back is a button that argues with you.
    */
    button, a { transition: transform 140ms cubic-bezier(0.2, 0, 0, 1); }
    button:active, a:active { transform: scale(0.972); }

    @media (prefers-reduced-motion: reduce) {
      .stage > *, .stage > .tabbar, .fill, .grow { animation: none; }
      button, a { transition: none; }
      button:active, a:active { transform: none; }
    }

  </style>
</helmet>

<div class="stage" style="width: 390px; height: 900px; box-sizing: border-box; background: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #ffffff; display: flex; flex-direction: column; overflow: hidden;">

  <!--
    Same 44px bar as every other screen, so the large title always starts at
    the same place. A bar glyph is WHITE: the accent is reserved for the one
    primary action, and an escape hatch or an add button is not it.
  -->
  <div style="flex: none; height: 44px; padding: 0 20px; display: flex; align-items: center;">
    <span style="flex-grow: 1;"></span>
    <button type="button" style="flex: none; height: 34px; margin-right: -2px; padding: 0 14px; border-radius: 999px; border: 0; background: #ff375f; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 7px; text-decoration: none;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New group</span></button>
  </div>

  <div style="flex: none; padding: 0 20px;">
    <span style="font-size: 34px; font-weight: 700; letter-spacing: 0.01em;">Groups</span>
  </div>

  <!-- an invite waiting, which is the one thing that must not be missed -->
  <div style="flex: none; margin: 20px 20px 0; border-radius: 14px; background: #1c1c1e; border: 1px solid #ff375f; padding: 16px; display: flex; flex-direction: column; gap: 13px;">
    <div style="display: flex; align-items: center; gap: 11px;">
      <span style="flex: none; width: 38px; height: 38px; border-radius: 999px; background: linear-gradient(150deg, #4a6fb8, #2a4270); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">N</span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 16px; font-weight: 600;">Noor invited you</span>
        <span style="font-size: 13.5px; font-weight: 400; color: #8e8e93;">Weekend Runners &middot; 5 members &middot; money on</span>
      </div>
    </div>
    <div style="display: flex; gap: 9px;">
      <button type="button" style="flex-grow: 1; border: 0; padding: 12px; border-radius: 11px; background: #ff375f; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 600;">Have a look</button>
      <button type="button" style="flex: none; border: 0; padding: 12px 18px; border-radius: 11px; background: #2c2c2e; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 500;">Later</button>
    </div>
  </div>

  <!-- the groups themselves -->
  <div style="flex: none; margin: 26px 20px 0; display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <a href="{{g.href}}" style="text-decoration: none; border-radius: 14px; background: #1c1c1e; padding: 15px 16px; display: flex; flex-direction: column; gap: 13px;">
        <div style="display: flex; align-items: center; gap: 11px;">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 17px; font-weight: 600; color: #ffffff;">{{g.name}}</span>
              <sc-if value="{{g.live}}" hint-placeholder-val="{{true}}">
                <span style="width: 7px; height: 7px; border-radius: 999px; background: #ff375f;"></span>
              </sc-if>
            </div>
            <span style="font-size: 13.5px; font-weight: 400; color: #8e8e93;">{{g.sub}}</span>
          </div>
          <div style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
            <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 19px; font-weight: 700; color: #ffffff;">{{g.score}}</span>
            <span style="display: flex; align-items: center; gap: 5px;">
              <sc-if value="{{g.isDoubt}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#bd736a" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none;"><path d="M12 3.2 19.5 6v6c0 4.2-3 7.2-7.5 8.8C7.5 19.2 4.5 16.2 4.5 12V6Z"/><path d="M7 18 17 6.6"/></svg></sc-if>
              <sc-if value="{{g.isIntent}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none;"><path d="M12 21v-8"/><path d="M12 13C12 9.2 9.2 7 5.5 7c0 3.8 2.7 6 6.5 6Z"/><path d="M12.5 13c0-3.2 2.4-5.2 5.8-5.2 0 3.2-2.4 5.2-5.8 5.2Z"/></svg></sc-if>
              <sc-if value="{{g.isPractice}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7fa8ff" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none;"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.3"/><circle cx="12" cy="12" r="1" fill="#7fa8ff" stroke="none"/></svg></sc-if>
              <sc-if value="{{g.isDiscipline}}" hint-placeholder-val="{{true}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6ba17f" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none;"><path d="M12 3.2 19.5 6v6c0 4.2-3 7.2-7.5 8.8C7.5 19.2 4.5 16.2 4.5 12V6Z"/><path d="M8.7 11.8 11.2 14.3 15.6 9.8"/></svg></sc-if>
              <sc-if value="{{g.isUnbroken}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ff7a2f" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none;"><path d="M2.5 20 9 7.5 12.4 14 15 9.6 21.5 20Z"/><path d="M6.6 14.2h4.6"/></svg></sc-if>
              <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; color: {{g.tone}};">{{g.rank}}</span>
            </span>
          </div>
        </div>

        <!-- who is in it, and who has moved today -->
        <div style="display: flex; align-items: center; gap: 9px;">
          <div style="flex: none; display: flex;">
            <sc-for list="{{g.faces}}" as="f" hint-placeholder-count="3">
              <span style="width: 26px; height: 26px; border-radius: 999px; background: {{f.tint}}; border: 2px solid #1c1c1e; margin-right: -9px;"></span>
            </sc-for>
          </div>
          <span style="flex-grow: 1; margin-left: 12px; font-size: 13px; font-weight: 400; color: #8e8e93;">{{g.activity}}</span>
          <sc-if value="{{g.owes}}" hint-placeholder-val="{{false}}">
            <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; flex: none; font-size: 13px; font-weight: 600; color: #ff453a;">{{g.money}}</span>
          </sc-if>
          <sc-if value="{{g.owed}}" hint-placeholder-val="{{false}}">
            <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; flex: none; font-size: 13px; font-weight: 600; color: #30d158;">{{g.money}}</span>
          </sc-if>
        </div>
      </a>
    </sc-for>
  </div>

  <!-- the global score, which only you can see -->
  <div style="flex: none; margin: 28px 20px 0; border-radius: 14px; background: #1c1c1e; padding: 16px; display: flex; align-items: center; gap: 14px;">
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
      <span style="display: flex; align-items: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6ba17f" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" style="flex: none;"><path d="M12 3.2 19.5 6v6c0 4.2-3 7.2-7.5 8.8C7.5 19.2 4.5 16.2 4.5 12V6Z"/><path d="M8.7 11.8 11.2 14.3 15.6 9.8"/></svg><span style="font-size: 16px; font-weight: 600;">Across everything: <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600;">714</span></span></span>
      <span style="font-size: 13.5px; font-weight: 400; color: #8e8e93;">Only you ever see this. There is no leaderboard.</span>
    </div>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#48484a" stroke-width="2.2" stroke-linecap="round" style="flex: none;"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </div>

  <div style="flex-grow: 1;"></div>

  <!--
    Tab bar, to spec. iOS reserves 83pt here: 49 of content over a 34pt
    home-indicator area. Icons 25x25, labels 10pt. The active tab is FILLED
    as well as tinted, which is what the HIG asks for, so the state is not
    carried by colour alone.

    The 34pt is NOT drawn here. These artboards draw the app and not the phone:
    there is no status bar at the top, so there is no home indicator at the
    bottom, and reserving the strip with nothing in it just reads as a gap. The
    real app adds it back with env(safe-area-inset-bottom).
  -->
  <div class="tabbar" style="flex: none; display: flex; background: rgba(18,18,20,0.96); border-top: 0.5px solid #2c2c2e; padding: 0 6px 8px;">
    <a href="Main.dc.html" style="flex-grow: 1; height: 49px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2.5v3M16 2.5v3M3 9.5h18"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8e8e93;">Today</span>
    </a>
    <a href="Coach.dc.html" style="flex-grow: 1; height: 49px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="25" height="25" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.3" fill="#8e8e93"/><ellipse cx="8.5" cy="8" rx="3.6" ry="2.5" transform="rotate(-32 8.5 8)" fill="rgba(255,255,255,0.34)"/><ellipse cx="9.1" cy="12.4" rx="1.45" ry="2" fill="#000000" opacity="0.82"/><ellipse cx="15.2" cy="12.4" rx="1.45" ry="2" fill="#000000" opacity="0.82"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8e8e93;">Ren</span>
    </a>
    <a href="Stats.dc.html" style="flex-grow: 1; height: 49px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 4 3 5-7"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8e8e93;">Stats</span>
    </a>
    <a href="Groups.dc.html" aria-current="page" style="flex-grow: 1; height: 49px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="25" height="25" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.9" fill="#ff375f"/><path d="M2 20.5A7 7 0 0 1 16 20.5z" fill="#ff375f"/><circle cx="17.6" cy="9.4" r="2.9" fill="#ff375f" opacity="0.75"/><path d="M15.4 20.5a7.6 7.6 0 0 0-2.1-5.1h3.6a4.6 4.6 0 0 1 4.6 4.6v0.5z" fill="#ff375f" opacity="0.75"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #ff375f;">Groups</span>
    </a>
    <a href="Activities.dc.html" style="flex-grow: 1; height: 49px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.4 6.1l1.7 1.7L8.1 4.8M3.4 12.05l1.7 1.7L8.1 10.75M3.4 18l1.7 1.7L8.1 16.7"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8e8e93;">Activities</span>
    </a>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const blue = 'linear-gradient(150deg, #4a6fb8, #2a4270)';
    const amber = 'linear-gradient(150deg, #c97a3a, #8a4a1c)';
    const violet = 'linear-gradient(150deg, #7a4ab8, #432a70)';
    const green = 'linear-gradient(150deg, #3aa87a, #1c6449)';
    return {
      groups: [
        {
          name: 'Morning Crew', href: 'Group.dc.html', live: true,
          sub: '3 members · you share Sleep, Food, Supplements',
          score: '692', rank: 'DISCIPLINE', isDiscipline: true, tone: '#6ba17f',
          faces: [{ tint: blue }, { tint: amber }, { tint: violet }],
          activity: 'Mira and Anya logged today',
          owes: false, owed: true, money: '₹140 due to you',
        },
        {
          name: 'Flatmates', href: 'Group.dc.html', live: true,
          sub: '4 members · you share Screen, Nightfast',
          score: '431', rank: 'PRACTICE', isPractice: true, tone: '#7fa8ff',
          faces: [{ tint: violet }, { tint: green }, { tint: blue }],
          activity: 'Kabir logged 20 minutes ago',
          owes: true, owed: false, money: '₹200 owed',
        },
        {
          name: 'Reading Club', href: 'Group.dc.html', live: false,
          sub: '6 members · you share Reading · money off',
          score: '908', rank: 'UNBROKEN', isUnbroken: true, tone: '#ff7a2f',
          faces: [{ tint: green }, { tint: amber }, { tint: violet }],
          activity: 'Nothing today yet',
          owes: false, owed: false, money: '',
        },
      ],
    };
  }
}
</script>
</body>
</html>
