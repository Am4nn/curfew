<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0a09; }
    a { color: #7fa8ff; } a:hover { color: #a9c4ff; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0a09;color:#f2f2f2;font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex;flex-direction:column;">

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:center;gap:8px;"><span style="color:#8c8c8c;font-size:13px;">&#8249;</span><span style="font-size:16px;font-weight:600;letter-spacing:0.06em;">Night Owls</span></div>
    <div style="display:flex;gap:20px;border-bottom:1px solid #2e2c28;">
      <div style="font-size:13px;color:#8c8c8c;padding-bottom:8px;">Overview</div>
      <div style="font-size:13px;color:#f2f2f2;padding-bottom:8px;border-bottom:2px solid #f2f2f2;">Ledger</div>
      <div style="font-size:13px;color:#8c8c8c;padding-bottom:8px;">Rules</div>
      <div style="font-size:13px;color:#8c8c8c;padding-bottom:8px;">Wake</div>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:20px;">

    <!-- net positions, summary first -->
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="font-size:11px;letter-spacing:0.14em;color:#8c8c8c;">WHO OWES WHOM</div>
      <div style="border:1px solid #2e2c28;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <span style="font-size:14px;"><span style="color:#6ba17f;">Alex</span> owes you &#8377;50</span>
        <button type="button" style="border:1px solid #2e2c28;background:#17150f;color:#f2f2f2;font-family:inherit;font-size:12px;padding:6px 12px;cursor:pointer;">Settle</button>
      </div>
      <div style="border:1px solid #2e2c28;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <span style="font-size:14px;">You owe <span style="color:#e4574b;">Sam</span> &#8377;20</span>
        <button type="button" style="border:1px solid #f2f2f2;background:#f2f2f2;color:#0b0a09;font-family:inherit;font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;">Settle</button>
      </div>
    </div>

    <!-- history, secondary, boxed by entry -->
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="font-size:11px;letter-spacing:0.14em;color:#8c8c8c;">HISTORY</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="border:1px solid #2e2c28;padding:11px 12px;display:flex;justify-content:space-between;gap:10px;">
          <div style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:13px;">Fine &middot; missed confirm</span><span style="font-size:12px;color:#8c8c8c;">Sep 12</span></div>
          <span style="font-size:14px;color:#e4574b;">&#8377;50</span>
        </div>
        <div style="border:1px solid #2e2c28;padding:11px 12px;display:flex;justify-content:space-between;gap:10px;">
          <div style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:13px;">Settlement &middot; Alex paid you</span><span style="font-size:12px;color:#8c8c8c;">Sep 10</span></div>
          <span style="font-size:14px;color:#6ba17f;">&#8377;100</span>
        </div>
        <div style="border:1px solid #2e2c28;padding:11px 12px;display:flex;justify-content:space-between;gap:10px;">
          <div style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:13px;">Fine &middot; missed night</span><span style="font-size:12px;color:#8c8c8c;">Sep 08</span></div>
          <span style="font-size:14px;color:#e4574b;">&#8377;50</span>
        </div>
      </div>
    </div>

  </div>

  <div style="display:flex;border-top:1px solid #2e2c28;background:#0b0a09;">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;color:#8c8c8c;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path></svg>
      <span style="font-size:11px;">Home</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;color:#f2f2f2;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 20a5.5 5.5 0 0 1 11 0"></path><path d="M16.5 6.2a3 3 0 0 1 0 5.6"></path><path d="M15.5 20a5.5 5.5 0 0 0-1.2-3.5"></path></svg>
      <span style="font-size:11px;">Groups</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;color:#8c8c8c;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V11"></path><path d="M10 20V4"></path><path d="M16 20v-6"></path></svg>
      <span style="font-size:11px;">Stats</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;color:#8c8c8c;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="4" y1="8" x2="20" y2="8"></line><line x1="4" y1="16" x2="20" y2="16"></line><circle cx="9" cy="8" r="2.3" fill="#0b0a09"></circle><circle cx="15" cy="16" r="2.3" fill="#0b0a09"></circle></svg>
      <span style="font-size:11px;">Settings</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
