<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    html, body { margin: 0; background: #000000; overflow: hidden; }
    ::-webkit-scrollbar { width: 0; height: 0; }

    /*
      REVEAL. The sections of a screen rise together on a stagger that
      DECELERATES: the last few land almost at once, so the whole thing reads
      as one gesture arriving rather than a queue being served.

      Expo-out, 620ms, and it runs ONCE. Nothing on a page of content loops. A
      loop is for a character, and Ren is the only character here.

      The travel is 14px. More is a slide, less and the eye misses it.
    */
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    .stage > * { animation: rise 620ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stage > *:nth-child(1)  { animation-delay:   0ms; }
    .stage > *:nth-child(2)  { animation-delay:  73ms; }
    .stage > *:nth-child(3)  { animation-delay: 129ms; }
    .stage > *:nth-child(4)  { animation-delay: 173ms; }
    .stage > *:nth-child(5)  { animation-delay: 208ms; }
    .stage > *:nth-child(6)  { animation-delay: 235ms; }
    .stage > *:nth-child(7)  { animation-delay: 256ms; }
    .stage > *:nth-child(8)  { animation-delay: 272ms; }
    .stage > *:nth-child(9)  { animation-delay: 285ms; }
    .stage > *:nth-child(10) { animation-delay: 295ms; }
    .stage > *:nth-child(n+11) { animation-delay: 302ms; }

    /* Chrome does not arrive. It is simply there, and only fades up. */
    .stage > .tabbar { animation: appear 300ms ease-out both; }

    /* A bar draws itself, after the section carrying it has landed. */
    @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .fill { transform-origin: left center;   animation: fill 900ms 300ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .grow { transform-origin: bottom center; animation: grow 760ms 260ms cubic-bezier(0.16, 1, 0.3, 1) both; }

    /*
      PRESS. 140ms down, and the release rides the same curve rather than
      bouncing: a button that springs back is a button that argues with you.
    */
    button, a { transition: transform 140ms cubic-bezier(0.2, 0, 0, 1); }
    button:active, a:active { transform: scale(0.972); }

    @media (prefers-reduced-motion: reduce) {
      .stage > *, .stage > .tabbar, .fill, .grow { animation: none; }
      button, a { transition: none; }
      button:active, a:active { transform: none; }
    }

  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #ffffff; position: relative; overflow: hidden;">

  <!-- 1. AIM -->
  <sc-if value="{{isAim}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column;">
      <img src="/_blob/4d06b38a5688b46932db3a0f6f241639" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
      <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.55) 100%);"></div>

      <div style="position: relative; padding: 20px 16px 0; display: flex; align-items: center; gap: 12px;">
        <button type="button" aria-label="Cancel" style="flex: none; width: 44px; height: 44px; margin-left: -4px; border-radius: 999px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center;"><span style="width: 34px; height: 34px; border-radius: 999px; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </span></button>
        <div style="flex-grow: 1; display: flex; justify-content: center;">
          <span style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,0.45);">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v8a2.5 2.5 0 0 0 5 0V3M8.5 11v10M18 3c-1.6 1.4-2.4 3.4-2.4 5.6 0 1.6.8 2.6 2.4 2.8V21"/></svg>
            <span style="font-size: 14px; font-weight: 600;">Food</span>
            <span style="font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.6);">meal 3 of 3</span>
          </span>
        </div>
        <span style="flex: none; width: 34px;"></span>
      </div>

      <div style="flex-grow: 1;"></div>

      <div style="position: relative; padding: 0 16px 12px; display: flex; justify-content: center;">
        <span style="font-size: 13.5px; font-weight: 500; color: rgba(255,255,255,0.72); background: rgba(0,0,0,0.4); border-radius: 999px; padding: 4px 12px;">Live camera only. No gallery.</span>
      </div>

      <div style="position: relative; padding: 0 16px 32px; display: flex; align-items: center; justify-content: center; gap: 32px;">
        <span style="width: 44px;"></span>
        <button type="button" onClick="{{shoot}}" aria-label="Take the photo" style="width: 76px; height: 76px; border-radius: 999px; border: 4px solid rgba(255,255,255,0.9); background: transparent; display: flex; align-items: center; justify-content: center; padding: 0;">
          <span style="width: 60px; height: 60px; border-radius: 999px; background: #ffffff;"></span>
        </button>
        <button type="button" aria-label="Switch camera" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a8 8 0 0 1 13.5-3.5L20 8"/><path d="M20 4v4h-4"/><path d="M20 15a8 8 0 0 1-13.5 3.5L4 16"/><path d="M4 20v-4h4"/></svg>
        </button>
      </div>
    </div>
  </sc-if>

  <!-- 2. REVIEW: the shot, plus the module's own field -->
  <sc-if value="{{isReview}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; background: #000000;">
      <div style="flex: none; height: 470px; position: relative; background: #1c1c1e; overflow: hidden;">
        <img src="/_blob/4d06b38a5688b46932db3a0f6f241639" alt="The meal just photographed" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
        <div style="position: absolute; left: 0; right: 0; top: 0; height: 110px; background: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0));"></div>
        <button type="button" onClick="{{retake}}" style="position: absolute; left: 20px; top: 22px; border: 0; padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,0.5); color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600;">Retake</button>
        <span style="position: absolute; right: 20px; top: 22px; display: flex; align-items: center; gap: 4px; padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,0.5); font-size: 12.5px; font-weight: 600;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Taken 7:04 PM
        </span>
      </div>

      <div style="flex-grow: 1; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; color: #8e8e93;">CALORIES</span>
          <div style="display: flex; align-items: center; gap: 12px;">
            <button type="button" onClick="{{less}}" aria-label="Fewer calories" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 0; background: #1c1c1e; display: flex; align-items: center; justify-content: center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg>
            </button>
            <span style="flex-grow: 1; text-align: center; font-size: 40px; font-weight: 700; letter-spacing: -0.02em;">{{cal}}</span>
            <button type="button" onClick="{{more}}" aria-label="More calories" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 0; background: #1c1c1e; display: flex; align-items: center; justify-content: center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
            </button>
          </div>
          <span style="font-size: 14px; font-weight: 400; color: #8e8e93;">{{calNote}}</span>
        </div>

        <button type="button" onClick="{{log}}" style="border: 0; width: 100%; padding: 16px; border-radius: 14px; background: #ff375f; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600;">Log this meal</button>
      </div>
    </div>
  </sc-if>

  <!-- 3. DONE -->
  <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0 32px;">
      <span style="width: 78px; height: 78px; border-radius: 999px; background: #ff375f; display: flex; align-items: center; justify-content: center;">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </span>

      <span style="margin-top: 20px; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; text-align: center;">Meal 3 logged</span>
      <span style="margin-top: 8px; font-size: 16px; font-weight: 400; color: #8e8e93; text-align: center;">Three meals, 1,640 calories. Food counts today.</span>

      <div style="margin-top: 32px; width: 100%; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1;">4</span>
          <span style="font-size: 17px; font-weight: 600; color: #48484a;">of 7 today</span>
          <span style="flex-grow: 1;"></span>
          <span style="font-size: 14px; font-weight: 600; color: #ff375f;">+1</span>
        </div>
        <div style="display: flex; gap: 4px;">
          <sc-for list="{{segments}}" as="s" hint-placeholder-count="7">
            <span style="flex-grow: 1; height: 5px; border-radius: 999px; background: {{s.fill}};"></span>
          </sc-for>
        </div>
      </div>

      <div style="margin-top: 24px; display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: #1c1c1e;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#ff375f"><path d="M12 2c0 4.2-5 5.2-5 10.2a5 5 0 0 0 10 0c0-2.1-1-3.2-1-3.2s-1 2-2.1 2c-1.1 0 1.1-4.2-1.9-9z"/></svg>
        <span style="font-size: 15px; font-weight: 600;">Food streak 6</span>
        <span style="font-size: 15px; font-weight: 400; color: #8e8e93;">best 28</span>
      </div>

      <a href="Main.dc.html" style="margin-top: 38px; text-decoration: none; font-size: 17px; font-weight: 600; color: #ff375f;">Back to today</a>
    </div>
  </sc-if>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'aim', cal: 520 };
  }
  renderVals() {
    const step = this.state.step;
    const cal = this.state.cal;
    const ON = '#ff375f', OFF = '#2c2c2e';
    return {
      isAim: step === 'aim',
      isReview: step === 'review',
      isDone: step === 'done',
      cal,
      calNote: `${1120 + cal} of 2,000 once this is sent.`,
      shoot: () => this.setState({ step: 'review' }),
      retake: () => this.setState({ step: 'aim' }),
      log: () => this.setState({ step: 'done' }),
      less: () => this.setState({ cal: Math.max(0, cal - 50) }),
      more: () => this.setState({ cal: cal + 50 }),
      segments: Array.from({ length: 7 }, (_, i) => ({ fill: i < 4 ? ON : OFF })),
    };
  }
}
</script>
</body>
</html>
