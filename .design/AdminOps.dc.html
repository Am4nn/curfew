<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0a09; }
    a { color: #7fa8ff; } a:hover { color: #a9c4ff; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0a09;color:#f2f2f2;font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex;flex-direction:column;">

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #f2f2f2;padding-bottom:10px;">
      <div style="font-size:15px;font-weight:600;letter-spacing:0.14em;">ADMIN</div>
      <span style="font-size:12px;color:#8c8c8c;">&#8249; dashboard</span>
    </div>
    <div style="display:flex;gap:18px;overflow-x:auto;">
      <span style="font-size:13px;color:#8c8c8c;padding-bottom:8px;white-space:nowrap;">Overview</span>
      <span style="font-size:13px;color:#8c8c8c;padding-bottom:8px;white-space:nowrap;">Insights</span>
      <span style="font-size:13px;color:#8c8c8c;padding-bottom:8px;white-space:nowrap;">Users</span>
      <span style="font-size:13px;color:#8c8c8c;padding-bottom:8px;white-space:nowrap;">Groups</span>
      <span style="font-size:13px;color:#f2f2f2;padding-bottom:8px;border-bottom:2px solid #f2f2f2;white-space:nowrap;">Ops</span>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:24px;">

    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="font-size:11px;letter-spacing:0.14em;color:#8c8c8c;">SCORING</div>
      <div style="font-size:13px;color:#8c8c8c;line-height:1.5;">Recompute scores and fines from events. Idempotent: safe to run any time.</div>
      <div style="display:flex;gap:8px;">
        <div style="flex:1;border:1px solid #2e2c28;padding:11px 12px;font-size:13px;color:#8c8c8c;">from date (optional)</div>
        <button type="button" style="border:1px solid #f2f2f2;background:#f2f2f2;color:#0b0a09;font-family:inherit;font-size:13px;font-weight:600;padding:0 16px;cursor:pointer;">Run</button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="font-size:11px;letter-spacing:0.14em;color:#8c8c8c;">VERIFY</div>
      <div style="font-size:13px;color:#8c8c8c;line-height:1.5;">Recompute a date range and diff against stored rows.</div>
      <button type="button" style="align-self:flex-start;border:1px solid #2e2c28;background:#17150f;color:#f2f2f2;font-family:inherit;font-size:13px;padding:11px 16px;cursor:pointer;">Run verify</button>
      <div style="border-left:3px solid #6ba17f;background:#17150f;padding:11px 13px;font-size:13px;color:#6ba17f;">No drift. Stored rows match a fresh recompute.</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
