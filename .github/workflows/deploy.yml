name: "Deploy: Production"

# Production ships on a version tag, never on a push. Vercel's git integration
# ignores tags, so production deploys come from the CLI here and the Production
# Branch setting points at a branch nobody pushes. Pushes to main are Preview
# deployments, which Vercel makes on its own.
#
# The build runs ON VERCEL, not here. Vercel marks environment variables as
# sensitive, and sensitive values are never returned by `vercel pull`: they come
# back empty, so a local `vercel build` fails on the first variable it reads.
# Uploading the source and letting Vercel build is the only path with real
# values, and it keeps the secrets where they belong.
#
# A production deployment is STAGED until it is promoted. Vercel keeps the live
# domains on the previous build until then, which is why deploying alone changed
# nothing the first time. The tag is the release gesture, so the promote step
# finishes the job. Rolling back is Instant Rollback in the dashboard, or a
# promote of the previous deployment.
#
# CI's result on this exact commit gates all of it, rather than a shorter copy of
# it running here. A Vercel build that fails is never promoted, so production
# keeps serving the previous deployment either way.
#
# One way in: a v* tag. It deploys to production and promotes it.
#
# There used to be a manual dispatch here that deployed a PREVIEW, as a way to
# prove this pipeline without touching the live site, and as the way round
# Vercel's GitHub App going quiet. `preview.yml` does both now, on every push
# to main and on a dispatch of its own, so this was a second way to do one
# thing and it left a workflow called "Deploy: Production" able to deploy
# something that was not production.
on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Production does not ship unless CI PASSED on this exact commit, and this
  # waits for it rather than glancing at it.
  #
  # It used to require an already-completed run, which is a false negative on
  # the ordinary case: a tag cut while CI is still running on the same commit
  # found nothing completed and refused, when CI was going to pass two minutes
  # later. Waiting covers that and the one that matters more, which is a tag
  # racing a CI run that is about to fail.
  #
  # This used to be an inline typecheck and test here, which was a second,
  # shorter list of the same checks: the two could drift, and the deploy's copy
  # was always the weaker one. Requiring CI's own result instead means a tag
  # carries everything CI runs, including the migration, security, simulation
  # and dependency jobs that were never repeated here.
  #
  # Checked by SHA rather than by ref, because a tag can be moved to a commit
  # CI never saw.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Wait for CI, then require it passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash .github/wait-for-ci.sh

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The admin console reads its version from package.json, so a tag that
      # disagrees with it would put a number on screen that is not what shipped.
      # Bump package.json in the commit you tag.
      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "shipping $pkg"

      # No --prebuilt: the source goes up and Vercel builds it, with the real
      # values of its own environment variables. The CLI prints the deployment
      # URL on stdout and its progress on stderr, so capturing stdout is enough.
      - name: Deploy to production
        id: deploy
        run: |
          url="$(bunx vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed $url"

      # Until this runs, the live domains still point at the previous build.
      - name: Promote to the production domains
        run: |
          bunx vercel promote "${{ steps.deploy.outputs.url }}" \
            --yes --token="$VERCEL_TOKEN"
          echo "promoted ${{ steps.deploy.outputs.url }}"
