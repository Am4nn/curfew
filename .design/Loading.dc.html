<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0a09; }
    @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0a09;color:#f2f2f2;font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex;flex-direction:column;">

  <!-- same header -->
  <div style="display:flex;align-items:center;gap:8px;padding:20px 20px 14px;border-bottom:1px solid #2e2c28;">
    <svg width="15" height="15" viewBox="0 0 32 32" shape-rendering="crispEdges" fill="#f2f2f2"><rect x="2" y="2" width="13" height="13"></rect><rect x="17" y="2" width="13" height="13"></rect><rect x="2" y="17" width="13" height="13"></rect></svg>
    <div style="font-size:15px;font-weight:600;letter-spacing:0.14em;">CURFEW</div>
  </div>

  <!-- content: nav stays, centered text while loading -->
  <div class="pulse" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;">
    <svg width="26" height="26" viewBox="0 0 32 32" shape-rendering="crispEdges" fill="#f2f2f2"><rect x="2" y="2" width="13" height="13"></rect><rect x="17" y="2" width="13" height="13"></rect><rect x="2" y="17" width="13" height="13"></rect></svg>
    <div style="font-size:13px;letter-spacing:0.14em;color:#8c8c8c;">LOADING</div>
  </div>

  <!-- same bottom tabs, persistent -->
  <div style="display:flex;border-top:1px solid #2e2c28;background:#0b0a09;">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;color:#f2f2f2;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path></svg>
      <span style="font-size:11px;">Home</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;color:#8c8c8c;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 20a5.5 5.5 0 0 1 11 0"></path><path d="M16.5 6.2a3 3 0 0 1 0 5.6"></path><path d="M15.5 20a5.5 5.5 0 0 0-1.2-3.5"></path></svg>
      <span style="font-size:11px;">Groups</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;color:#8c8c8c;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V11"></path><path d="M10 20V4"></path><path d="M16 20v-6"></path></svg>
      <span style="font-size:11px;">Stats</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;color:#8c8c8c;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="4" y1="8" x2="20" y2="8"></line><line x1="4" y1="16" x2="20" y2="16"></line><circle cx="9" cy="8" r="2.3" fill="#0b0a09"></circle><circle cx="15" cy="16" r="2.3" fill="#0b0a09"></circle></svg>
      <span style="font-size:11px;">Settings</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
