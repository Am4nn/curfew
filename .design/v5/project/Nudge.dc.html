<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nudge a friend</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>

    /*
      REVEAL. The sections of a screen rise together on a stagger that
      DECELERATES: the last few land almost at once, so the whole thing reads
      as one gesture arriving rather than a queue being served.

      Expo-out, 620ms, and it runs ONCE. Nothing on a page of content loops. A
      loop is for a character, and Ren is the only character here.

      The travel is 14px. More is a slide, less and the eye misses it.
    */
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    .stage > * { animation: rise 620ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stage > *:nth-child(1)  { animation-delay:   0ms; }
    .stage > *:nth-child(2)  { animation-delay:  73ms; }
    .stage > *:nth-child(3)  { animation-delay: 129ms; }
    .stage > *:nth-child(4)  { animation-delay: 173ms; }
    .stage > *:nth-child(5)  { animation-delay: 208ms; }
    .stage > *:nth-child(6)  { animation-delay: 235ms; }
    .stage > *:nth-child(7)  { animation-delay: 256ms; }
    .stage > *:nth-child(8)  { animation-delay: 272ms; }
    .stage > *:nth-child(9)  { animation-delay: 285ms; }
    .stage > *:nth-child(10) { animation-delay: 295ms; }
    .stage > *:nth-child(n+11) { animation-delay: 302ms; }

    /* Chrome does not arrive. It is simply there, and only fades up. */
    .stage > .tabbar { animation: appear 300ms ease-out both; }

    /* A bar draws itself, after the section carrying it has landed. */
    @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .fill { transform-origin: left center;   animation: fill 900ms 300ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .grow { transform-origin: bottom center; animation: grow 760ms 260ms cubic-bezier(0.16, 1, 0.3, 1) both; }

    /*
      PRESS. 140ms down, and the release rides the same curve rather than
      bouncing: a button that springs back is a button that argues with you.
    */
    button, a { transition: transform 140ms cubic-bezier(0.2, 0, 0, 1); }
    button:active, a:active { transform: scale(0.972); }

    @media (prefers-reduced-motion: reduce) {
      .stage > *, .stage > .tabbar, .fill, .grow { animation: none; }
      button, a { transition: none; }
      button:active, a:active { transform: none; }
    }
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    body { margin: 0; }
  </style>
</helmet>

<div class="stage" style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <!--
    The nav bar, to the canvas spec. 44px tall, contents centred, 20px screen
    margin. The back control is a 44x44 tap target pulled left by 12, which is
    44 minus the 20px chevron over two, so the CHEVRON'S own left edge lands on
    the margin, exactly above the first letter of the large title. No disc: the
    disc is only for a chevron over a photograph.
  -->
  <div style="flex: none; height: 44px; padding: 0 16px; display: flex; align-items: center;">
    <a href="Main.dc.html" aria-label="Back" style="flex: none; width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #ffffff; text-decoration: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
  </div>

  <!-- BEFORE SENDING -->
  <sc-if value="{{pending}}" hint-placeholder-val="{{true}}">
    <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px;">

      <h1 style="margin: 4px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2;">Nudge Mira</h1>

      <!-- What she is actually short of, named the way her own row names it. -->
      <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 15px; color: #8e8e93;">Water, 3 of 8</span>
        <span style="width: 3px; height: 3px; border-radius: 999px; background: #48484a;"></span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13.5px; font-weight: 600; color: #8e8e93;">2H LEFT</span>
      </div>

      <!--
        Four set messages, no text box. Tapping one sends it, so these ARE the
        action rather than a way of composing it: one tap, no keyboard, nothing
        to think of. Filled grey with a white label, which is unmistakably
        pressable. None is pink, because pink is the one primary action on a
        screen and these are four equal ways of doing the same thing.
      -->
      <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 8px;">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
          <button type="button" onClick="{{o.pick}}" style="width: 100%; height: 52px; padding: 0 16px; border-radius: 16px; border: none; background: #2c2c2e; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 600; text-align: left;">{{o.text}}</button>
        </sc-for>
      </div>

      <div style="flex-grow: 1;"></div>

      <!--
        Said plainly, because a nudge is the first thing in Curfew that puts a
        notification on somebody else's phone and the sender should know what
        lands there. It also answers "is this anonymous" without a FAQ.
      -->
      <p style="margin: 0 0 28px; font-size: 12.5px; line-height: 1.45; color: #8e8e93;">She sees your name, the message and the activity. Nothing arrives during her quiet hours.</p>
    </div>
  </sc-if>

  <!-- AFTER SENDING -->
  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px;">

      <h1 style="margin: 4px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2;">Sent</h1>

      <!-- Her phone, quoted back, so the sender knows exactly what was said. -->
      <div style="margin-top: 24px; padding: 16px 16px; border-radius: 16px; background: #1c1c1e;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: #8e8e93;">ON MIRA'S PHONE</span>
        <p style="margin: 8px 0 0; font-size: 16px; font-weight: 600; line-height: 1.35;">Aman: {{sent}}</p>
        <p style="margin: 4px 0 0; font-size: 14px; color: #8e8e93;">Water, 3 of 8. Two hours left.</p>
      </div>

      <!--
        No congratulation and no count of nudges sent. Sending one is not an
        achievement, and a running total would turn helping somebody into a
        score, which is the one thing this screen must not become.
      -->
      <p style="margin: 16px 0 0; font-size: 13.5px; line-height: 1.45; color: #8e8e93;">You can send another whenever you like.</p>

      <div style="flex-grow: 1;"></div>

      <a href="Main.dc.html" style="margin-bottom: 28px; height: 52px; border-radius: 16px; background: #ff375f; color: #ffffff; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">Done</a>
    </div>
  </sc-if>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: null };
  }
  renderVals() {
    // Four lines, fixed. A text box would make Curfew a messaging app, which
    // needs blocking, reporting and an answer to what happens when somebody
    // replies. None of that exists, and none of it is what a nudge is for.
    const lines = ["Don't break it", "Still time", "I already went", "Thinking of you"];
    return {
      pending: this.state.sent === null,
      done: this.state.sent !== null,
      sent: this.state.sent,
      options: lines.map((text) => ({
        text,
        pick: () => this.setState({ sent: text }),
      })),
    };
  }
}
</script>
</body>
</html>
