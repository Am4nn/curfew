<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0a09; }
    a { color: #7fa8ff; } a:hover { color: #a9c4ff; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0a09;color:#f2f2f2;font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex;flex-direction:column;">

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:center;gap:8px;"><span style="color:#8c8c8c;font-size:13px;">&#8249;</span><span style="font-size:16px;font-weight:600;letter-spacing:0.06em;">Night Owls</span></div>
    <div style="display:flex;gap:20px;border-bottom:1px solid #2e2c28;">
      <div style="font-size:13px;color:#8c8c8c;padding-bottom:8px;">Overview</div>
      <div style="font-size:13px;color:#8c8c8c;padding-bottom:8px;">Ledger</div>
      <div style="font-size:13px;color:#8c8c8c;padding-bottom:8px;">Rules</div>
      <div style="font-size:13px;color:#f2f2f2;padding-bottom:8px;border-bottom:2px solid #f2f2f2;">Wake</div>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:14px;">

    <div style="display:flex;align-items:baseline;justify-content:space-between;">
      <div style="font-size:11px;letter-spacing:0.14em;color:#8c8c8c;">WAKE TIMES</div>
      <div style="font-size:11px;color:#8c8c8c;">last 30 days</div>
    </div>

    <svg viewBox="0 0 350 170" width="100%" style="display:block;">
      <line x1="40" y1="20" x2="350" y2="20" stroke="#2e2c28"></line>
      <line x1="40" y1="80" x2="350" y2="80" stroke="#2e2c28"></line>
      <line x1="40" y1="140" x2="350" y2="140" stroke="#2e2c28"></line>
      <text x="2" y="24" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#8c8c8c">08:00</text>
      <text x="2" y="84" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#8c8c8c">07:00</text>
      <text x="2" y="144" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#8c8c8c">06:00</text>
      <!-- You -->
      <polyline points="40,96 84,90 128,102 172,84 216,88 260,78 304,86 350,74" fill="none" stroke="#f2f2f2" stroke-width="1.6"></polyline>
      <!-- Alex -->
      <polyline points="40,64 84,58 128,68 172,50 216,60 260,46 304,54 350,44" fill="none" stroke="#7fa8ff" stroke-width="1.6"></polyline>
    </svg>

    <div style="display:flex;gap:18px;">
      <div style="display:flex;align-items:center;gap:7px;"><span style="width:16px;height:2px;background:#f2f2f2;"></span><span style="font-size:12px;">You</span></div>
      <div style="display:flex;align-items:center;gap:7px;"><span style="width:16px;height:2px;background:#7fa8ff;"></span><span style="font-size:12px;">Alex</span></div>
      <div style="display:flex;align-items:center;gap:7px;"><span style="width:16px;height:2px;background:#8c8c8c;"></span><span style="font-size:12px;color:#8c8c8c;">Sam</span></div>
    </div>

    <div style="font-size:12px;color:#8c8c8c;line-height:1.5;">Everyone's actual wake time each night. Descriptive only, this never ranks anyone.</div>

  </div>

  <div style="display:flex;border-top:1px solid #2e2c28;background:#0b0a09;">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;color:#8c8c8c;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path></svg><span style="font-size:11px;">Home</span></div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;color:#f2f2f2;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 20a5.5 5.5 0 0 1 11 0"></path><path d="M16.5 6.2a3 3 0 0 1 0 5.6"></path><path d="M15.5 20a5.5 5.5 0 0 0-1.2-3.5"></path></svg><span style="font-size:11px;">Groups</span></div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;color:#8c8c8c;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V11"></path><path d="M10 20V4"></path><path d="M16 20v-6"></path></svg><span style="font-size:11px;">Stats</span></div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 12px;color:#8c8c8c;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="4" y1="8" x2="20" y2="8"></line><line x1="4" y1="16" x2="20" y2="16"></line><circle cx="9" cy="8" r="2.3" fill="#0b0a09"></circle><circle cx="15" cy="16" r="2.3" fill="#0b0a09"></circle></svg><span style="font-size:11px;">Settings</span></div>
  </div>

</div>
</x-dc>
</body>
</html>
