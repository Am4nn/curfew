<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0a09; }
    a { color: #7fa8ff; } a:hover { color: #a9c4ff; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0a09;color:#f2f2f2;font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex;flex-direction:column;">

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #f2f2f2;padding-bottom:10px;">
      <div style="font-size:15px;font-weight:600;letter-spacing:0.14em;">ADMIN</div>
      <span style="font-size:12px;color:#8c8c8c;">&#8249; dashboard</span>
    </div>
    <div style="display:flex;gap:18px;overflow-x:auto;">
      <span style="font-size:13px;color:#8c8c8c;padding-bottom:8px;white-space:nowrap;">Overview</span>
      <span style="font-size:13px;color:#f2f2f2;padding-bottom:8px;border-bottom:2px solid #f2f2f2;white-space:nowrap;">Insights</span>
      <span style="font-size:13px;color:#8c8c8c;padding-bottom:8px;white-space:nowrap;">Users</span>
      <span style="font-size:13px;color:#8c8c8c;padding-bottom:8px;white-space:nowrap;">Groups</span>
      <span style="font-size:13px;color:#8c8c8c;padding-bottom:8px;white-space:nowrap;">Ops</span>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:24px;">

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:11px;letter-spacing:0.14em;color:#8c8c8c;">CHECK-INS PER DAY</div>
      <div style="display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:84px;">
        <div style="background:#f2f2f2;height:50%;"></div><div style="background:#f2f2f2;height:66%;"></div><div style="background:#f2f2f2;height:58%;"></div><div style="background:#f2f2f2;height:80%;"></div><div style="background:#f2f2f2;height:72%;"></div><div style="background:#f2f2f2;height:60%;"></div><div style="background:#f2f2f2;height:88%;"></div><div style="background:#f2f2f2;height:70%;"></div><div style="background:#f2f2f2;height:54%;"></div><div style="background:#f2f2f2;height:76%;"></div><div style="background:#f2f2f2;height:64%;"></div><div style="background:#f2f2f2;height:82%;"></div><div style="background:#f2f2f2;height:90%;"></div><div style="background:#f2f2f2;height:74%;"></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;"><span style="font-size:11px;letter-spacing:0.14em;color:#8c8c8c;">PASS RATE</span><span style="font-size:11px;color:#8c8c8c;">% of scored periods</span></div>
      <svg viewBox="0 0 350 96" width="100%" style="display:block;">
        <line x1="0" y1="20" x2="350" y2="20" stroke="#2e2c28"></line>
        <line x1="0" y1="88" x2="350" y2="88" stroke="#2e2c28"></line>
        <polyline points="0,60 40,52 80,56 120,44 160,40 200,48 240,34 280,38 320,28 350,30" fill="none" stroke="#6ba17f" stroke-width="2"></polyline>
      </svg>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:11px;letter-spacing:0.14em;color:#8c8c8c;">PASS RATE BY DAY</div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:80px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;"><div style="width:100%;height:70%;background:#6ba17f;"></div><span style="font-size:10px;color:#8c8c8c;">M</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;"><div style="width:100%;height:82%;background:#6ba17f;"></div><span style="font-size:10px;color:#8c8c8c;">T</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;"><div style="width:100%;height:76%;background:#6ba17f;"></div><span style="font-size:10px;color:#8c8c8c;">W</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;"><div style="width:100%;height:90%;background:#6ba17f;"></div><span style="font-size:10px;color:#8c8c8c;">T</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;"><div style="width:100%;height:64%;background:#6ba17f;"></div><span style="font-size:10px;color:#8c8c8c;">F</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;"><div style="width:100%;height:46%;background:#6ba17f;"></div><span style="font-size:10px;color:#8c8c8c;">S</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;"><div style="width:100%;height:56%;background:#6ba17f;"></div><span style="font-size:10px;color:#8c8c8c;">S</span></div>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
