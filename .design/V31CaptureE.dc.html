<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0a09; }
    a { color: #f2f2f2; } a:hover { color: #8c8c8c; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
    .shot {
      background:
        radial-gradient(ellipse 70px 52px at 41% 44%, #e0a352, transparent 72%),
        radial-gradient(ellipse 58px 46px at 60% 52%, #b8462a, transparent 74%),
        radial-gradient(ellipse 46px 40px at 50% 63%, #7d9448, transparent 76%),
        radial-gradient(ellipse 150px 122px at 50% 52%, #f3e7cf, transparent 66%),
        radial-gradient(ellipse 300px 240px at 62% 22%, #7a6242, transparent 70%),
        linear-gradient(168deg, #5d4830, #241a12 72%);
    }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0a09;color:#f2f2f2;font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex;flex-direction:column;">

  <div class="shot" style="position:relative;flex:1;min-height:0;display:flex;flex-direction:column;">
    <div style="position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px;">
      <span style="background:#0b0a09;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#f2f2f2" stroke-width="1.7" stroke-linecap="square"><path d="M5 5l14 14"></path><path d="M19 5 5 19"></path></svg></span>
      <span style="background:#0b0a09;height:44px;display:flex;align-items:center;gap:9px;padding:0 13px;font-size:11.5px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f2f2f2" stroke-width="1.6" stroke-linecap="square"><path d="M20 11a8 8 0 1 0-1.6 5.6"></path><path d="M20 5v6h-6"></path></svg>Retake</span>
    </div>
  </div>

  <div style="background:#0b0a09;border-top:1px solid #2e2c28;display:flex;flex-direction:column;flex:none;">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 12px;">
      <span style="font-size:13.5px;font-weight:600;">Meal 3 of 3</span>
      <span style="font-size:11px;color:#8c8c8c;">9:04 PM</span>
    </div>

    <div style="padding:0 20px;display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;flex-direction:column;gap:7px;">
        <span style="font-size:11px;letter-spacing:0.06em;color:#8c8c8c;">Calories</span>
        <div style="border:1px solid #4a4740;background:#0b0a09;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <span style="font-size:17px;">640</span>
          <span style="font-size:12px;color:#8c8c8c;">cal</span>
        </div>
      </div>
      <span style="font-size:11.5px;color:#8c8c8c;line-height:1.5;">1820 of 2000 today. This takes you to 2460, over the limit.</span>
    </div>

    <div style="padding:16px 20px 22px;">
      <button type="button" style="width:100%;height:52px;border:1px solid #f2f2f2;background:#f2f2f2;color:#0b0a09;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;">Send</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
