name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # --max-warnings=0, so there is no second class of lint result that
      # everybody learns to scroll past.
      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # The one thing about the schedule no test can see: vercel.json is in UTC
      # and a period ends in the member's zone. `0 4 * * *` was 90 minutes
      # before a sleep night became scorable, so its fine posted a day late.
      - name: The nightly job runs late enough to score last night
        run: bun run check:cron

      # The build validates env at module load and pre-renders routes. It never
      # connects to a database (queries run only per request), so dummy but
      # well-formed values are enough. Never put real secrets here.
      - name: Build
        run: bun run build
        env:
          DATABASE_URL_POOLED: postgresql://ci:ci@localhost:5432/ci
          DATABASE_URL_DIRECT: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-build-secret-not-used-at-runtime
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          CRON_SECRET: ci-cron-secret
          RESEND_API_KEY: ci-resend-key
          EMAIL_FROM: "Curfew <notices@example.com>"

  # What we depend on, on the two axes a lockfile cannot answer by itself:
  # published advisories, and packages their own authors have retired.
  #
  # Its own job on purpose. Both read the live npm registry, so this one can turn
  # red on a morning when nothing in the repo changed, and that must not look
  # like the code failing.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: No known advisories
        run: bun audit

      # Fails on anything deprecated that is not written down as deliberate, in
      # ALLOWED in the script, with a reason.
      - name: Nothing we chose is deprecated
        run: bun run check:deps

      # The same question about the pipeline itself. `actions/checkout` sitting
      # on an end-of-life Node was found by an annotation on a green run, which
      # is to say by luck.
      - name: Nothing the pipeline runs on is behind
        run: bun run check:actions
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Migrations and the registry sync, against a throwaway Postgres. This proves
  # `bun run migrate` applies every numbered file cleanly from empty and that
  # sync-activities reconciles every registered module into a row.
  #
  # It cannot prove the DEPLOYED database is in sync: a fresh database has no
  # rows until this job's own sync writes them. That guard is the same
  # `--check`, run against the real database after a deploy. See CONFIG.md.
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # LOCAL_MODE routes both scripts through node-postgres, since the Neon
      # driver cannot speak to a plain Postgres.
      LOCAL_MODE: "1"
      DATABASE_URL_DIRECT: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate from empty
        run: bun run scripts/migrate.ts

      - name: Sync the activity registry
        run: bun run scripts/sync-activities.ts

      - name: Every module has a row
        run: bun run scripts/sync-activities.ts --check

      - name: Migrating twice changes nothing
        run: bun run scripts/migrate.ts

  # The security round, against its own throwaway Postgres.
  #
  # It used to run only when somebody remembered, only against the preview
  # database, and only as one particular person: it found "me" by a hardcoded
  # email and then scored that account, wrote ledger rows against it and deleted
  # its derived rows on the way out. It now creates its own three people and its
  # own admin, so it runs anywhere and is a check rather than a ritual.
  #
  # No dev server here, so the HTTP half skips itself and says so. That half is
  # run by hand against a server: `bun run break-in:local` beside `bun run
  # local`, or `bun run break-in -- --http=<origin>` against a real-auth one.
  break-in:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # `src/lib/env.ts` validates the whole set at module load, so every key has
    # to be here even for the ones this round never reaches. Locally that is
    # invisible: bun loads `.env.local` on its own, which is why a run that
    # looked like this one passed on a laptop and failed here.
    env:
      LOCAL_MODE: "1"
      DATABASE_URL_DIRECT: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_POOLED: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-break-in-secret
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      CRON_SECRET: ci-cron-secret
      RESEND_API_KEY: ci-resend-key
      EMAIL_FROM: "Curfew <notices@example.com>"
    steps:
      - uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate from empty
        run: bun run scripts/migrate.ts

      - name: Sync the activity registry
        run: bun run scripts/sync-activities.ts

      - name: Break in
        run: bun run scripts/break-in/run.ts

  # The engine, end to end, against its own throwaway Postgres.
  #
  # These are integration tests in everything but name and they are the only
  # things that would catch a change to the reputation curve, the fine split or
  # the streak rules. The 232 unit tests cover the domain, which is pure; every
  # layer above it is covered only here.
  #
  # Two passes, because they answer different questions. `simulate` runs 30
  # written scenarios and asserts what each one should produce, and re-verifies
  # after every one. `verify` then rebuilds a seeded database from its events and
  # diffs it against what is stored, which is the check that the stored rows and
  # a full replay still agree.
  simulate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # The whole set, for the same reason the break-in job carries it: env.ts
    # validates all of it at module load, and locally bun quietly supplies the
    # missing ones from .env.local.
    env:
      LOCAL_MODE: "1"
      DATABASE_URL_DIRECT: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_POOLED: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-simulate-secret
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      CRON_SECRET: ci-cron-secret
      RESEND_API_KEY: ci-resend-key
      EMAIL_FROM: "Curfew <notices@example.com>"
    steps:
      - uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate from empty
        run: bun run scripts/migrate.ts

      - name: Sync the activity registry
        run: bun run scripts/sync-activities.ts

      # Wipes between scenarios and leaves the database empty, which is why the
      # seed below comes after it rather than before.
      - name: Every scenario
        run: bun run scripts/simulate/run.ts

      - name: Seed a history
        run: bun run scripts/seed-local.ts

      - name: The stored rows agree with a replay
        run: bun run scripts/verify.ts

      # Four narrow proofs that each exist because the thing they check went
      # wrong once. They ran by hand until now, which is the same as not
      # running: a fine charged twice, a curve change that does not heal, a
      # config write on the wrong day and a first session that counts for
      # nothing are all silent.
      - name: A fine is charged once
        run: bun run scripts/check-money.ts

      - name: A curve change repairs itself
        run: bun run scripts/check-logic-version.ts

      - name: Days belong to the member
        run: bun run scripts/check-timezones.ts

      - name: The first thing you ever do counts
        run: bun run scripts/check-streak.ts

  # The half only a browser can answer, and the half of break-in that needs a
  # server. Both used to run when somebody remembered.
  #
  # A DEV server, not a built one, and that is not laziness. LOCAL_MODE is
  # double-gated on NODE_ENV not being "production" so it can never wake up on
  # Vercel, and `next start` sets exactly that, so a built server here would
  # have no fixed identity and every route would redirect to sign-in. The
  # trade is a slower first hit per route, which the timeouts allow for.
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOCAL_MODE: "1"
      DATABASE_URL_DIRECT: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_POOLED: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-browser-secret
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      CRON_SECRET: ci-cron-secret
      RESEND_API_KEY: ci-resend-key
      EMAIL_FROM: "Curfew <notices@example.com>"
    steps:
      - uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install chromium
        run: bunx playwright install --with-deps chromium

      - name: Migrate from empty
        run: bun run scripts/migrate.ts

      - name: Sync the activity registry
        run: bun run scripts/sync-activities.ts

      - name: Seed a history
        run: bun run scripts/seed-local.ts

      # Backgrounded, then waited for. `bun run local` reads .env.local, which
      # is gitignored and does not exist here, so the server is started
      # directly against the job's own environment.
      - name: Start the app
        run: |
          bunx next dev > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000 && exit 0
            sleep 2
          done
          echo "the server never answered"; cat /tmp/next.log; exit 1

      - name: Every screen, and the forms on them
        run: bun run browser

      # The suite says a screen failed; only the server knows why. Without this
      # the dev server's log is written to /tmp and thrown away with the runner,
      # so a route that threw in CI and renders locally cannot be diagnosed at
      # all. Printed on failure only, and `if: failure()` rather than `always()`
      # so a green run stays short.
      - name: What the server said
        if: failure()
        run: tail -200 /tmp/next.log

      # With a server up, the ten checks that skip themselves in the other job
      # actually run: signed-out routes, somebody else's group over HTTP, and
      # the positive control that proves the detector works.
      - name: Break in, including the HTTP half
        run: bun run scripts/break-in/run.ts

      - name: The server said nothing alarming
        if: always()
        run: tail -50 /tmp/next.log
