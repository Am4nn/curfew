<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0a09; }
    a { color: #7fa8ff; } a:hover { color: #a9c4ff; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0a09;color:#f2f2f2;font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex;flex-direction:column;">

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #f2f2f2;padding-bottom:10px;">
      <div style="font-size:15px;font-weight:600;letter-spacing:0.14em;">ADMIN</div>
      <span style="font-size:12px;color:#8c8c8c;">&#8249; dashboard</span>
    </div>
    <div style="display:flex;gap:18px;overflow-x:auto;">
      <span style="font-size:13px;color:#f2f2f2;padding-bottom:8px;border-bottom:2px solid #f2f2f2;white-space:nowrap;">Overview</span>
      <span style="font-size:13px;color:#8c8c8c;padding-bottom:8px;white-space:nowrap;">Insights</span>
      <span style="font-size:13px;color:#8c8c8c;padding-bottom:8px;white-space:nowrap;">Users</span>
      <span style="font-size:13px;color:#8c8c8c;padding-bottom:8px;white-space:nowrap;">Groups</span>
      <span style="font-size:13px;color:#8c8c8c;padding-bottom:8px;white-space:nowrap;">Ops</span>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:22px;">

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;">
      <div style="border:1px solid #2e2c28;padding:14px;display:flex;flex-direction:column;gap:6px;"><span style="font-size:11px;color:#8c8c8c;">USERS</span><span style="font-size:24px;font-weight:600;">6</span></div>
      <div style="border:1px solid #2e2c28;padding:14px;display:flex;flex-direction:column;gap:6px;"><span style="font-size:11px;color:#8c8c8c;">PENDING</span><span style="font-size:24px;font-weight:600;color:#7fa8ff;">1</span></div>
      <div style="border:1px solid #2e2c28;padding:14px;display:flex;flex-direction:column;gap:6px;"><span style="font-size:11px;color:#8c8c8c;">GROUPS</span><span style="font-size:24px;font-weight:600;">3</span></div>
      <div style="border:1px solid #2e2c28;padding:14px;display:flex;flex-direction:column;gap:6px;"><span style="font-size:11px;color:#8c8c8c;">OUTSTANDING</span><span style="font-size:24px;font-weight:600;color:#e4574b;">&#8377;5,200</span></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="font-size:11px;letter-spacing:0.14em;color:#8c8c8c;">PENDING APPROVALS</div>
      <div style="border:1px solid #2e2c28;padding:14px;display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:14px;">Pat Nguyen</span><span style="font-size:12px;color:#8c8c8c;">pat@curfew.local</span></div>
        <div style="display:flex;gap:8px;">
          <button type="button" style="flex:1;height:40px;border:1px solid #f2f2f2;background:#f2f2f2;color:#0b0a09;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;">Approve</button>
          <button type="button" style="flex:1;height:40px;border:1px solid #e4574b;background:transparent;color:#e4574b;font-family:inherit;font-size:13px;cursor:pointer;">Reject</button>
        </div>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
