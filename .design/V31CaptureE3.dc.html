<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0a09; }
    a { color: #f2f2f2; } a:hover { color: #8c8c8c; }
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#0b0a09;color:#f2f2f2;font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 11px;border-bottom:1px solid #2e2c28;flex:none;">
    <div style="display:flex;align-items:center;gap:9px;"><span style="color:#8c8c8c;font-size:14px;">&#8249;</span><span style="font-size:14px;font-weight:600;letter-spacing:0.14em;">STUDY</span></div>
    <span style="font-size:11px;color:#8c8c8c;">9:04 PM</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 12px;">
      <span style="font-size:13.5px;font-weight:600;">Session</span>
      <span style="font-size:11px;color:#8c8c8c;">no photo needed</span>
    </div>

    <div style="padding:0 20px;display:flex;flex-direction:column;gap:16px;">

      <div style="display:flex;flex-direction:column;gap:7px;">
        <span style="font-size:11px;letter-spacing:0.06em;color:#8c8c8c;">Minutes studied</span>
        <div style="border:1px solid #4a4740;background:#0b0a09;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <span style="font-size:17px;">45</span>
          <span style="font-size:12px;color:#8c8c8c;">min</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:7px;">
        <span style="font-size:11px;letter-spacing:0.06em;color:#8c8c8c;">Subject</span>
        <div style="border:1px solid #2e2c28;background:#0b0a09;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <span style="font-size:15px;color:#8c8c8c;">Optional</span>
          <span style="color:#8c8c8c;font-size:14px;">&#8250;</span>
        </div>
      </div>

      <span style="font-size:11.5px;color:#8c8c8c;line-height:1.5;">Target is 45. Anything at or above counts.</span>
    </div>

    <div style="flex:1;"></div>

    <div style="padding:16px 20px 22px;border-top:1px solid #2e2c28;">
      <button type="button" style="width:100%;height:52px;border:1px solid #f2f2f2;background:#f2f2f2;color:#0b0a09;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;">Send</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
