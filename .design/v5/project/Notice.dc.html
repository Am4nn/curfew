<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap">
  <style>
    html, body { margin: 0; background: #000000; overflow: hidden; }
    ::-webkit-scrollbar { width: 0; height: 0; }

    /*
      REVEAL. The sections of a screen rise together on a stagger that
      DECELERATES: the last few land almost at once, so the whole thing reads
      as one gesture arriving rather than a queue being served.

      Expo-out, 620ms, and it runs ONCE. Nothing on a page of content loops. A
      loop is for a character, and Ren is the only character here.

      The travel is 14px. More is a slide, less and the eye misses it.
    */
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    .stage > * { animation: rise 620ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stage > *:nth-child(1)  { animation-delay:   0ms; }
    .stage > *:nth-child(2)  { animation-delay:  73ms; }
    .stage > *:nth-child(3)  { animation-delay: 129ms; }
    .stage > *:nth-child(4)  { animation-delay: 173ms; }
    .stage > *:nth-child(5)  { animation-delay: 208ms; }
    .stage > *:nth-child(6)  { animation-delay: 235ms; }
    .stage > *:nth-child(7)  { animation-delay: 256ms; }
    .stage > *:nth-child(8)  { animation-delay: 272ms; }
    .stage > *:nth-child(9)  { animation-delay: 285ms; }
    .stage > *:nth-child(10) { animation-delay: 295ms; }
    .stage > *:nth-child(n+11) { animation-delay: 302ms; }

    /* Chrome does not arrive. It is simply there, and only fades up. */
    .stage > .tabbar { animation: appear 300ms ease-out both; }

    /* A bar draws itself, after the section carrying it has landed. */
    @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .fill { transform-origin: left center;   animation: fill 900ms 300ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .grow { transform-origin: bottom center; animation: grow 760ms 260ms cubic-bezier(0.16, 1, 0.3, 1) both; }

    /*
      PRESS. 140ms down, and the release rides the same curve rather than
      bouncing: a button that springs back is a button that argues with you.
    */
    button, a { transition: transform 140ms cubic-bezier(0.2, 0, 0, 1); }
    button:active, a:active { transform: scale(0.972); }


    @media (prefers-reduced-motion: reduce) {
      .stage > *, .stage > .tabbar, .fill, .grow { animation: none; }
      button, a { transition: none; }
      button:active, a:active { transform: none; }
    }

  </style>
</helmet>

<div class="stage" style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #ffffff; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- Home, dimmed, so it is obvious what is behind this and that it is yours. -->
  <div style="position: absolute; inset: 0; opacity: 0.22; display: flex; flex-direction: column; padding: 16px 20px 0;">
    <span style="font-size: 34px; font-weight: 700;">Today</span>
    <span style="margin-top: 22px; font-size: 44px; font-weight: 700;">4 <span style="font-size: 20px; color: #8e8e93;">of 7</span></span>
    <div style="margin-top: 16px; display: flex; gap: 4px;">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="7">
        <span style="flex-grow: 1; height: 5px; border-radius: 999px; background: {{s.fill}};"></span>
      </sc-for>
    </div>
    <sc-for list="{{ghost}}" as="g" hint-placeholder-count="5">
      <div style="margin-top: 18px; display: flex; align-items: center; gap: 12px;">
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #2c2c2e;"></span>
        <span style="flex-grow: 1; height: 13px; border-radius: 4px; background: #1c1c1e;"></span>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.72);"></div>

  <div style="position: absolute; left: 16px; right: 16px; top: 132px; border-radius: 22px; background: #161618; border: 0.5px solid rgba(255,255,255,0.1); padding: 26px 22px 22px; display: flex; flex-direction: column;">
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #ff375f;">CURFEW 4.0</span>
    <h2 style="margin: 12px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2;">Ren, nudges, and Monk mode</h2>

    <div style="margin-top: 18px; display: flex; flex-direction: column; gap: 14px;">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
        <div style="display: flex; gap: 11px;">
          <span style="flex: none; margin-top: 7px; width: 5px; height: 5px; border-radius: 999px; background: #ff375f;"></span>
          <span style="flex-grow: 1; font-size: 15px; line-height: 1.5; color: #c7c7cc;">{{l.text}}</span>
        </div>
      </sc-for>
    </div>

    <!--
      The words came out of release-notes.json in the same commit as the change
      they describe, so they went through review with the code. Nothing here was
      typed at the moment of publishing.
    -->
    <button type="button" style="margin-top: 24px; width: 100%; height: 50px; border: 0; border-radius: 14px; background: #ff375f; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600;">Got it</button>
    <span style="margin-top: 11px; text-align: center; font-size: 12px; color: #48484a;">There is no dismiss. Got it is final.</span>
  </div>

</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ON = '#ff375f', OFF = '#2c2c2e';
    return {
      segs: Array.from({ length: 7 }, (_, i) => ({ fill: i < 4 ? ON : OFF })),
      ghost: Array.from({ length: 5 }, () => ({})),
      lines: [
        { text: 'Ren is a coach who reads what you log, including your photographs, and says what he notices. He never scores anything.' },
        { text: 'You can see who in your groups is at risk right now, and nudge them. Four set messages, no typing.' },
        { text: 'Monk mode reads the activities you already track and gives the day a percentage. No streak, no pass, no fine.' },
        { text: 'Cold shower and No junk food are new activities. Both are a held-or-slipped answer with no photograph.' },
      ],
    };
  }
}
</script>
</body>
</html>
