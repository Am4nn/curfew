<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Somebody nudged you</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    body { margin: 0; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex: none; padding: 12px 20px 0;">
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em;">Today</h1>
    <span style="display: block; margin-top: 4px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; color: #8e8e93;">THU 17 SEPTEMBER</span>
  </div>

  <!--
    THE WHOLE IDEA OF THIS SCREEN IS THAT IT IS ONE CARD, NOT TWO.
    A nudge is not a message to read and then act on somewhere else. If it
    arrived in an inbox, answering it would be: open the message, understand
    it, navigate to Water, press. Four steps to drink a glass of water, and a
    message list to build, with replies, unread counts and a badge that is not
    about your day.

    So the nudge and the press are the same card. What Aman said sits directly
    above the control that answers him, and the whole thing disappears when the
    activity is done. Nothing to dismiss, nothing to reply to.
  -->
  <div style="flex: none; margin: 20px 20px 0; border-radius: 20px; background: #1c1c1e; overflow: hidden;">

    <div style="padding: 16px 18px 0; display: flex; align-items: center; gap: 10px;">
      <span style="flex: none; width: 30px; height: 30px; border-radius: 999px; background: linear-gradient(150deg, #b8744a, #70402a); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;">A</span>
      <span style="flex-grow: 1; font-size: 14px; color: #8e8e93;">Aman nudged you</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; color: #8e8e93;">7:12 PM</span>
    </div>

    <!--
      His words, at the size of a thing somebody said, not a caption. This is
      the one sentence on the screen that is not the app talking, so it is not
      in the app's register and it is not in mono. It is a person.
    -->
    <p style="margin: 14px 18px 0; font-size: 22px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em;">Don&#39;t break it</p>

    <div style="margin: 18px 0 0; height: 1px; background: rgba(255,255,255,0.08);"></div>

    <!-- The activity itself, drawn exactly as its row on Home is drawn. -->
    <div style="padding: 14px 18px 18px;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <span style="flex: none; width: 34px; height: 34px; border-radius: 10px; background: #2c2c2e; display: flex; align-items: center; justify-content: center;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.4 6 10.2A6 6 0 0 1 6 13.2C6 9.4 12 3 12 3z"/></svg>
        </span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <div style="display: flex; align-items: center; gap: 7px;">
            <span style="font-size: 16px; font-weight: 500;">Water</span>
            <span style="display: flex; align-items: center; gap: 2px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="#ff375f" aria-hidden="true"><path d="M12 2c0 4.2-5 5.2-5 10.2a5 5 0 0 0 10 0c0-2.1-1-3.2-1-3.2s-1 2-2.1 2c-1.1 0 1.1-4.2-1.9-9z"/></svg>
              <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; font-weight: 600; color: #ff375f;">22</span>
            </span>
          </div>
          <span style="font-size: 13px; color: #8e8e93;">3 of 8 today</span>
        </div>
        <span style="flex: none; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; font-weight: 600; color: #8e8e93;">2H LEFT</span>
      </div>

      <!--
        The press, full width, pink, because answering the nudge IS the primary
        action on this screen and there is exactly one of them.
      -->
      <button type="button" style="margin-top: 14px; width: 100%; height: 48px; border-radius: 14px; border: none; background: #ff375f; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600;">+1 glass</button>
    </div>
  </div>

  <!--
    No reply button, and that is the decision rather than an omission. Replying
    is a conversation, and a conversation needs an inbox, unread state, blocking
    and reporting. Doing the thing is the reply.
  -->
  <p style="flex: none; margin: 14px 20px 0; font-size: 12.5px; line-height: 1.5; color: #8e8e93;">This clears itself when Water is done. Aman is told you finished, not that you read it.</p>

  <div style="flex-grow: 1;"></div>

  <!-- The rest of the day carries on underneath, unchanged. -->
  <div style="flex: none; margin: 0 20px; opacity: 0.45; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 11px; padding: 11px 0; border-top: 1px solid rgba(255,255,255,0.08);">
      <span style="flex-grow: 1; font-size: 16px; color: #8e8e93;">Sleep</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; color: #8e8e93;">11:04 PM</span>
    </div>
    <div style="display: flex; align-items: center; gap: 11px; padding: 11px 0; border-top: 1px solid rgba(255,255,255,0.08);">
      <span style="flex-grow: 1; font-size: 16px; color: #8e8e93;">Reading</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; color: #8e8e93;">9:20 PM</span>
    </div>
  </div>

  <!-- Tab bar, five, matching every other screen. -->
  <div style="flex: none; display: flex; background: rgba(18,18,20,0.96); border-top: 0.5px solid #2c2c2e; padding: 0 6px 8px;">
    <a href="Main.dc.html" aria-current="page" style="flex-grow: 1; height: 49px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="25" height="25" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="4" fill="#ff375f"/><path d="M8 2.5v3M16 2.5v3" stroke="#ff375f" stroke-width="2" stroke-linecap="round"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #ff375f;">Today</span>
    </a>
    <a href="Coach.dc.html" style="flex-grow: 1; height: 49px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="25" height="25" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.3" fill="#8e8e93"/><ellipse cx="8.5" cy="8" rx="3.6" ry="2.5" transform="rotate(-32 8.5 8)" fill="rgba(255,255,255,0.34)"/><ellipse cx="9.1" cy="12.4" rx="1.45" ry="2" fill="#000000" opacity="0.82"/><ellipse cx="15.2" cy="12.4" rx="1.45" ry="2" fill="#000000" opacity="0.82"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8e8e93;">Ren</span>
    </a>
    <a href="Stats.dc.html" style="flex-grow: 1; height: 49px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 4 3 5-7"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8e8e93;">Stats</span>
    </a>
    <a href="Groups.dc.html" style="flex-grow: 1; height: 49px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 8.5a3 3 0 0 1 0 5"/><path d="M19.5 20a6.5 6.5 0 0 0-3.2-5.2"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8e8e93;">Groups</span>
    </a>
    <a href="Activities.dc.html" style="flex-grow: 1; height: 49px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8e8e93;">You</span>
    </a>
  </div>

</div>
</x-dc>

</body>
</html>
